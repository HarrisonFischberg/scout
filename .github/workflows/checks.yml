# Deterministic checks only: no API keys, no paid calls. Live-provider runs
# (scripts/live-suite.mjs, scripts/live-qa.mjs) stay manual on the owner's Mac.
name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:release
