<!-- Scout for Safari solid glyph for dark pills (src/edge.ts floating tab, src/overlay.ts "Working…" toast): the truck
     filled in currentColor, its parts separated by a cut line in the pill color (.body stroke) and the window and hubs
     drawn in the pill color (.lens). Shown here with the edge tab's pill color. -->
