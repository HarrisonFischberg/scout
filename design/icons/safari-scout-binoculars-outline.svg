<!-- Scout for Safari toolbar icon (owner choice 2026-10-18): the outline binoculars from the new-chat screen
     (src/popup.html .scout-mark), so the toolbar matches the panel. Shapes are painted in order: each one's
     inside erases what is under it and its outline is drawn on top, like .scout-mark (fill = canvas, stroke = gray).
     scripts/render-toolbar-icons.mjs renders it to src/icons/toolbar[-dark]-N.png. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">
    <rect x="14" y="7" width="10" height="11" rx="3"/>
    <rect x="40" y="7" width="10" height="11" rx="3"/>
    <rect x="8" y="17" width="22" height="27" rx="7"/>
    <rect x="34" y="17" width="22" height="27" rx="7"/>
    <rect x="26" y="20" width="12" height="10" rx="3"/>
    <path d="M32 30v14"/>
    <circle cx="19" cy="45" r="13"/>
    <circle cx="45" cy="45" r="13"/>
  </g>
</svg>
