<!-- AssistAnt toolbar icon: original artwork made for this project (2026-10-15). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- antennae: dark outline under a violet line so they read on light and dark toolbars -->
  <g fill="none" stroke-linecap="round">
    <path d="M23 19 C20 11 15 7 10 8" stroke="#1A102E" stroke-width="7"/>
    <path d="M41 19 C44 11 49 7 54 8" stroke="#1A102E" stroke-width="7"/>
    <path d="M23 19 C20 11 15 7 10 8" stroke="#8B5CF6" stroke-width="3.5"/>
    <path d="M41 19 C44 11 49 7 54 8" stroke="#8B5CF6" stroke-width="3.5"/>
  </g>
  <circle cx="9" cy="8" r="6" fill="#C4B5FD" stroke="#1A102E" stroke-width="3"/>
  <circle cx="55" cy="8" r="6" fill="#C4B5FD" stroke="#1A102E" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="32" cy="39" rx="28" ry="23" fill="#8B5CF6" stroke="#1A102E" stroke-width="4"/>
  <!-- mismatched googly eyes, pupils glancing up -->
  <circle cx="20" cy="34" r="10" fill="#FFFFFF" stroke="#1A102E" stroke-width="3"/>
  <circle cx="43" cy="33" r="12.5" fill="#FFFFFF" stroke="#1A102E" stroke-width="3"/>
  <circle cx="23" cy="31" r="4.5" fill="#1A102E"/>
  <circle cx="47" cy="29.5" r="5.5" fill="#1A102E"/>
  <circle cx="24.4" cy="29.4" r="1.3" fill="#FFFFFF"/>
  <circle cx="48.8" cy="27.6" r="1.6" fill="#FFFFFF"/>
  <!-- lopsided grin with one buck tooth -->
  <path d="M18 48 Q31 59 46 47" fill="none" stroke="#1A102E" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="28.5" y="52" width="6.5" height="5.5" rx="1" fill="#FFFFFF" stroke="#1A102E" stroke-width="2"/>
</svg>
