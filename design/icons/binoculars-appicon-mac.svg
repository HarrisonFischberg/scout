<!-- Safari Scout macOS app icon: original artwork made for this project (2026-10-16).
     macOS icon grid: 824x824 tile centred on a 1024 canvas, soft drop shadow. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF5E4"/>
      <stop offset="1" stop-color="#EEDCAA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#14231A" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <svg x="212" y="212" width="600" height="600" viewBox="0 0 64 64">
    <g stroke="#14231A" stroke-width="3.2" stroke-linejoin="round">
      <rect x="11" y="5" width="13" height="12" rx="3" fill="#4A7836"/>
      <rect x="40" y="5" width="13" height="12" rx="3" fill="#4A7836"/>
      <rect x="5" y="15" width="25" height="28" rx="8" fill="#5E9445"/>
      <rect x="34" y="15" width="25" height="28" rx="8" fill="#5E9445"/>
      <rect x="26" y="18" width="12" height="11" rx="3" fill="#4A7836"/>
      <circle cx="17.5" cy="45" r="14" fill="#EAF4F8"/>
      <circle cx="46.5" cy="45" r="14" fill="#EAF4F8"/>
    </g>
    <circle cx="17.5" cy="45" r="8" fill="#9CCBDC"/>
    <circle cx="46.5" cy="45" r="8" fill="#9CCBDC"/>
    <circle cx="14" cy="41.5" r="2.6" fill="#FFFFFF"/>
    <circle cx="43" cy="41.5" r="2.6" fill="#FFFFFF"/>
  </svg>
</svg>
