<!-- AssistAnt iOS app icon: original artwork made for this project (2026-10-16).
     Full-bleed and opaque; iOS applies its own rounded mask. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <svg x="112" y="96" width="800" height="800" viewBox="0 0 128 128">
    <g stroke="#1A102E" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs (one waving hello) -->
    <g fill="none" stroke-width="5">
      <path d="M50 92 L36 100 L30 112"/>
      <path d="M52 100 L44 112"/>
      <path d="M78 92 L92 100 L98 112"/>
      <path d="M76 100 L84 112"/>
      <path d="M52 84 L36 78 L28 62"/>
      <path d="M76 84 L94 74 L104 58"/>
    </g>
    <circle cx="104" cy="56" r="5" fill="#C4B5FD" stroke-width="3.5"/>
    <!-- body: abdomen + thorax -->
    <ellipse cx="64" cy="104" rx="18" ry="13" fill="#7C3AED" stroke-width="4"/>
    <ellipse cx="64" cy="86" rx="12" ry="9" fill="#8B5CF6" stroke-width="4"/>
    <!-- antennae -->
    <g fill="none">
      <path d="M52 36 C48 22 40 16 32 18" stroke-width="7"/>
      <path d="M76 36 C81 22 89 15 97 18" stroke-width="7"/>
      <path d="M52 36 C48 22 40 16 32 18" stroke="#8B5CF6" stroke-width="3.5"/>
      <path d="M76 36 C81 22 89 15 97 18" stroke="#8B5CF6" stroke-width="3.5"/>
    </g>
    <circle cx="32" cy="18" r="6" fill="#C4B5FD" stroke-width="3.5"/>
    <circle cx="97" cy="18" r="6" fill="#C4B5FD" stroke-width="3.5"/>
    <!-- head -->
    <ellipse cx="64" cy="56" rx="29" ry="25" fill="#8B5CF6" stroke-width="4.5"/>
    <circle cx="51" cy="51" r="11" fill="#FFFFFF" stroke-width="3.5"/>
    <circle cx="76.5" cy="50" r="13.5" fill="#FFFFFF" stroke-width="3.5"/>
    <circle cx="54" cy="47.5" r="5" fill="#1A102E" stroke="none"/>
    <circle cx="80.5" cy="46" r="6" fill="#1A102E" stroke="none"/>
    <circle cx="55.6" cy="45.8" r="1.6" fill="#FFFFFF" stroke="none"/>
    <circle cx="82.5" cy="43.8" r="2" fill="#FFFFFF" stroke="none"/>
    <path d="M48 66 Q62 78 80 65" fill="none" stroke-width="4"/>
    <rect x="59" y="70.5" width="7.5" height="6.5" rx="1.5" fill="#FFFFFF" stroke-width="2.5"/>
  </g>
  </svg>
</svg>
